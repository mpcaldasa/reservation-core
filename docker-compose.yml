services:
  postgres:
    image: postgres:16
    container_name: slotix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: slotix
      POSTGRES_USER: slotix
      POSTGRES_PASSWORD: slotix_dev_password
    ports:
      - "5432:5432"
    volumes:
      - slotix_postgres_data:/var/lib/postgresql/data

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [observability]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  slotix_postgres_data:
