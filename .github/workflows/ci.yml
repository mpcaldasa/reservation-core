name: CI

on:
  push:
    branches: [main, feat/multi-tenant-foundation]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run integration tests with Testcontainers
        run: ./mvnw -B verify
      - name: Validate local service configuration
        run: docker compose config --quiet
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/aws
      - name: Validate AWS infrastructure
        run: |
          terraform -chdir=infra/aws init -backend=false -input=false
          terraform -chdir=infra/aws validate -no-color
      - name: Build application image
        run: docker build -t slotix-reservation-core:ci .
