name: CI

on:
  push:
    branches: [main, feat/multi-tenant-foundation]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run integration tests with Testcontainers
        run: ./mvnw -B verify
      - name: Build application image
        run: docker build -t slotix-reservation-core:ci .
