name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests and package verification
        run: ./mvnw -B verify

  infrastructure:
    name: Infrastructure verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate local service configuration
        run: docker compose config --quiet

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/aws

      - name: Initialize Terraform without a remote backend
        run: terraform -chdir=infra/aws init -backend=false -input=false

      - name: Validate AWS infrastructure
        run: terraform -chdir=infra/aws validate -no-color

  container:
    name: Container image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --tag slotix-reservation-core:ci .

  merge-gate:
    name: Merge gate
    if: always()
    needs: [backend, infrastructure, container]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          printf 'Backend: %s\nInfrastructure: %s\nContainer: %s\n' \
            "$BACKEND_RESULT" "$INFRASTRUCTURE_RESULT" "$CONTAINER_RESULT"
          test "$BACKEND_RESULT" = success
          test "$INFRASTRUCTURE_RESULT" = success
          test "$CONTAINER_RESULT" = success
