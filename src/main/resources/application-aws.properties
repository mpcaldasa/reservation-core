spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.forward-headers-strategy=framework
spring.mail.properties[mail.smtp.auth]=${SMTP_AUTH:false}
spring.mail.properties[mail.smtp.starttls.enable]=${SMTP_STARTTLS:true}
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.ssl.checkserveridentity]=true
server.tomcat.connection-timeout=10s
server.tomcat.threads.max=200
spring.datasource.hikari.maximum-pool-size=10
logging.structured.format.console=logstash
app.identity.invitation.acceptance-url=${APP_IDENTITY_INVITATION_ACCEPTANCE_URL:http://localhost:3000/accept-invitation}
app.identity.password-reset.acceptance-url=${APP_IDENTITY_PASSWORD_RESET_ACCEPTANCE_URL:http://localhost:3000/reset-password}
