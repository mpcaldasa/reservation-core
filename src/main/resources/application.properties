spring.application.name=reservation-core

# PostgreSQL Connection (Docker local)
spring.datasource.url=jdbc:postgresql://localhost:5432/slotix
spring.datasource.username=slotix
spring.datasource.password=slotix_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate:
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration