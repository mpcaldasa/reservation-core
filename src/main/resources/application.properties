spring.application.name=reservation-core
app.bootstrap.platform-admin.enabled=false
app.booking.pending-timeout=PT30M
app.booking.expiration.poll-interval-ms=60000
app.booking.expiration.initial-delay-ms=60000
app.booking.idempotency.ttl=PT24H
app.booking.idempotency.cleanup-interval-ms=60000
app.booking.idempotency.cleanup-initial-delay-ms=60000

# PostgreSQL Connection (Docker local)
spring.datasource.url=jdbc:postgresql://localhost:5432/slotix
spring.datasource.username=slotix
spring.datasource.password=slotix_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate:
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.tracing.sampling.probability=${APP_TRACING_SAMPLING_PROBABILITY:0.1}
management.tracing.export.otlp.enabled=${OTEL_TRACES_EXPORTER_ENABLED:false}
management.otlp.metrics.export.enabled=${OTEL_METRICS_EXPORTER_ENABLED:false}
management.otlp.metrics.export.step=60s
management.opentelemetry.resource-attributes[service.name]=${spring.application.name}
management.opentelemetry.resource-attributes[deployment.environment]=${APP_ENVIRONMENT:local}
jdbc.datasource-proxy.include-parameter-values=false
jdbc.opentelemetry.analysis.sanitize.enabled=true
jdbc.resultset-operations.enabled=false
logging.structured.format.console=logstash
# JWT: local development only. Use an environment variable or a secrets manager in production.
app.jwt.secret=slotix-dev-secret-key-cambiar-en-produccion-minimo-32-caracteres
app.jwt.expiration-minutes=60
app.notification.email.enabled=false
app.identity.invitation.acceptance-url=${APP_IDENTITY_INVITATION_ACCEPTANCE_URL:http://localhost:3000/accept-invitation}
app.identity.password-reset.acceptance-url=${APP_IDENTITY_PASSWORD_RESET_ACCEPTANCE_URL:http://localhost:3000/reset-password}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
